<title>개발 학습 노트 — 인증 보안 · 인프라 · 프레임워크</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --line: #d6d6d6;
    --soft: #f4f4f4;
    --accent: #2b5cd9;
    --accent-dark: #1e46ad;
    --accent-soft: #e9effc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    font-size: 18px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px 100px; }

  header.hero {
    background: #ffffff;
    border: 3px solid var(--accent);
    border-left-width: 10px;
    padding: 38px 36px;
    margin-bottom: 32px;
  }
  header.hero h1 { margin: 0 0 10px; font-size: 1.8em; line-height: 1.3; color: var(--accent); }
  header.hero p { margin: 0; }

  .doc { border: 1px solid var(--line); margin-bottom: 20px; background: #fff; }
  .doc-head {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 22px 26px;
    background: #fff;
    border: none;
    border-left: 6px solid var(--accent);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    font-size: 1em;
  }
  .doc-head:hover { background: var(--accent-soft); }
  .doc-num {
    flex: 0 0 auto;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 14px;
    font-size: 0.85em;
  }
  .doc-title { flex: 1 1 auto; }
  .doc-title strong { display: block; font-size: 1.12em; }
  .doc-title span { display: block; font-size: 0.85em; margin-top: 2px; }
  .chev {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    border-right: 3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    transform: rotate(45deg);
    transition: transform 0.25s;
    margin-top: -6px;
  }
  .doc.open .chev { transform: rotate(225deg); margin-top: 6px; }

  .doc-tools {
    display: none;
    padding: 10px 26px;
    border-top: 1px solid var(--line);
    background: var(--soft);
    font-size: 0.85em;
  }
  .doc.open .doc-tools { display: block; }
  .doc-tools a { color: var(--accent); }

  .doc-body { display: none; border-top: 1px solid var(--line); }
  .doc.open .doc-body { display: block; }
  .doc-body iframe {
    display: block;
    width: 100%;
    height: 1200px;
    border: none;
    background: #fff;
  }

  footer { text-align: center; font-size: 0.85em; margin-top: 40px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<script>
(function () {
  'use strict';

  // 부모 주소의 ?seek= 값을 문서 iframe에도 전달한다 (애니메이션 시점 테스트용)
  var seek = null;
  try {
    var q = new URLSearchParams(window.location.search).get('seek');
    if (q !== null && isFinite(parseFloat(q))) seek = q;
  } catch (e) { /* 무시 */ }

  function resizeFrame(iframe) {
    try {
      var doc = iframe.contentDocument;
      if (doc && doc.documentElement) {
        var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
        if (h > 200) iframe.style.height = (h + 40) + 'px';
      }
    } catch (e) { /* 교차 출처 등으로 못 읽으면 기본 높이 유지 */ }
  }

  function ensureFrame(article) {
    var body = article.querySelector('.doc-body');
    var iframe = body.querySelector('iframe');
    if (iframe) return;
    iframe = document.createElement('iframe');
    var src = article.getAttribute('data-src');
    if (seek !== null) src += '?seek=' + encodeURIComponent(seek);
    iframe.src = src;
    iframe.title = article.querySelector('.doc-title strong').textContent;
    iframe.addEventListener('load', function () {
      resizeFrame(iframe);
      // 폰트/이미지 로딩으로 높이가 늦게 확정되는 경우를 대비해 몇 번 더 재측정
      var tries = 0;
      var timer = setInterval(function () {
        resizeFrame(iframe);
        if (++tries >= 5) clearInterval(timer);
      }, 800);
    });
    body.appendChild(iframe);
  }

  function toggle(article, forceOpen) {
    var willOpen = forceOpen === true || !article.classList.contains('open');
    if (willOpen) {
      article.classList.add('open');
      ensureFrame(article);
      if (history.replaceState) history.replaceState(null, '', '#' + article.id);
    } else {
      article.classList.remove('open');
    }
  }

  var articles = document.querySelectorAll('article.doc');
  Array.prototype.forEach.call(articles, function (article) {
    article.querySelector('.doc-head').addEventListener('click', function () {
      toggle(article);
    });
  });

  // #auth 처럼 해시로 들어오면 해당 문서를 자동으로 펼친다
  var hash = window.location.hash.replace('#', '');
  if (hash) {
    var target = document.getElementById(hash);
    if (target && target.classList.contains('doc')) {
      toggle(target, true);
      target.scrollIntoView();
    }
  }
})();
</script>
</body>
